# nginx reverse proxy for the IBL feedback server.
# Install to /etc/nginx/sites-available/ibl-feedback, symlink into
# sites-enabled, then run certbot to add TLS:
#   sudo ln -s /etc/nginx/sites-available/ibl-feedback /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d feedback.example.org

# Rate-/connection-limit zones for the public ingest endpoint. The ingest token
# is shipped publicly in the client (write-only by design), so the real abuse
# defense lives here, not in the token. These must sit in the http context;
# sites-enabled files are included inside nginx.conf's http {} block, so placing
# them outside the server {} block below puts them there.
limit_req_zone  $binary_remote_addr zone=ibl_feedback_req:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=ibl_feedback_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name feedback.example.org;

    # Must be >= the client's MAX_PAYLOAD_BYTES (30 MB).
    client_max_body_size 30m;

    location /static/ {
        alias /opt/ibl-feedback-server/server/staticfiles/;
    }

    # Public, token-only ingest endpoint — rate-limit it. burst=5 absorbs a
    # brief retry flurry (nodelay serves the burst immediately rather than
    # queueing); limit_conn caps simultaneous 30 MB uploads from one IP, which
    # is the main guard against a disk-fill flood. Matches /api/feedback and
    # /api/feedback/. The reviewer UI under location / is unaffected.
    location /api/feedback {
        limit_req  zone=ibl_feedback_req burst=5 nodelay;
        limit_conn ibl_feedback_conn 2;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
